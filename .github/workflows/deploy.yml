name: CI/CD Pipeline for Spring Boot on EC2

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Spring Boot application
        run: |
          ./gradlew clean assemble --no-daemon

      - name: Docker Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/dnd-13th-3-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/dnd-13th-3-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="/home/ec2-user/dnd-13th-3-backend"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            cat <<'EOF' > docker-compose.yml
            version: '3.8'
            services:
              app:
                image: ${{ secrets.DOCKER_USERNAME }}/dnd-13th-3-backend:latest
                container_name: spring-app
                ports:
                  - "8080:8080"
                env_file:
                  - ./.env
                environment:
                  - PROFILE=prod
                  - SPRING_DATA_REDIS_HOST=redis
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_started
                networks:
                  - app-network
                restart: always
            
              db:
                image: mysql:8.0
                container_name: mysql-db
                ports:
                  - "3306:3306"
                env_file:
                  - ./.env
                volumes:
                  - db_data:/var/lib/mysql
                healthcheck:
                  test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                  start_period: 30s
                networks:
                  - app-network
                restart: always
            
              redis:
                image: redis:latest
                container_name: redis-cache
                restart: always
                ports:
                  - "6379:6379"
                networks:
                  - app-network

            networks:
              app-network:
                driver: bridge
            
            volumes:
              db_data:
            EOF
            
            cat <<'EOF' > .env
            DB_URL="jdbc:mysql://db:3306/${{ secrets.DB_NAME }}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true"
            DB_USERNAME="${{ secrets.DB_USERNAME }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            
            MYSQL_DATABASE="${{ secrets.DB_NAME }}"
            MYSQL_ROOT_PASSWORD="${{ secrets.DB_ROOT_PASSWORD }}"
            MYSQL_USER="${{ secrets.DB_USERNAME }}"
            MYSQL_PASSWORD="${{ secrets.DB_PASSWORD }}"
            
            SPRING_DATA_REDIS_PORT=6379

            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            FRONTEND_BASE_URL="${{ secrets.FRONTEND_BASE_URL }}"
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            EOF
            
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            docker-compose down
            docker-compose pull
            docker-compose up -d
            
            docker image prune -af
