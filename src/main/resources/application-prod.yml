spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "https://minu.site/login/oauth2/code/google"

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
